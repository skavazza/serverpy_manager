<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câmera ao vivo</title>
  <link rel="stylesheet" href="/_camera/viewer.css">
  <script src="/_camera/viewer.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Câmera ao vivo</h1>
      <label><span id="language-label">Idioma</span>
        <select id="language"><option value="pt">Português</option><option value="en">English</option></select>
      </label>
    </header>
    <p id="note">Taxa de quadros configurada no desktop, sem áudio.</p>
    <div class="preview"><img id="frame" alt="Imagem da câmera" hidden></div>
    <p id="status" role="status" aria-live="polite">Conectando…</p>
    <p id="metrics">Aguardando métricas da transmissão…</p>
    <button id="pause" type="button" aria-pressed="false">Pausar visualização</button>
    <p><a id="files" href="/">Abrir arquivos</a></p>
    <noscript>Ative o JavaScript para visualizar a câmera / Enable JavaScript to view the camera.</noscript>
  </main>
</body>
</html>
