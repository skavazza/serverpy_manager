<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#182231">
    <title>ServerPy | Sem conexão</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #182231; color: #edf2f7; }
        main { max-width: 440px; padding: 32px; }
        h1 { font-size: 25px; } p { line-height: 1.6; color: #c1cad6; }
        button { background: #78a7ff; color: #101722; padding: 12px 20px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <strong>ServerPy</strong>
        <h1 id="title">Servidor indisponível</h1>
        <p id="message">Verifique sua conexão e se o servidor está ligado. Seus arquivos continuam no servidor e estarão disponíveis quando a conexão voltar.</p>
        <button id="retry" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
        try {
            if (localStorage.getItem('serverpy_language') === 'en') {
                document.documentElement.lang = 'en'; document.title = 'ServerPy | Offline';
                document.getElementById('title').textContent = 'Server unavailable';
                document.getElementById('message').textContent = 'Check your connection and make sure the server is running. Your files remain on the server and will be available when the connection returns.';
                document.getElementById('retry').textContent = 'Try again';
            }
        } catch {}
    </script>
</body>
</html>
